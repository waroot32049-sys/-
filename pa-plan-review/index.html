function hasAny(text,words){const t=(text||'').toLowerCase();return words.some(w=>t.includes(String(w).toLowerCase()))}
function cleanText(t){return String(t||'').replace(/\u0000/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
function snippetFor(text,words,max=260){
 const lines=cleanText(text).split(/\n+/).map(x=>x.trim()).filter(Boolean);
 for(const line of lines){if(words.some(w=>line.toLowerCase().includes(String(w).toLowerCase())))return line.slice(0,max)}
 const low=text.toLowerCase();for(const w of words){const i=low.indexOf(String(w).toLowerCase());if(i>=0)return cleanText(text.slice(Math.max(0,i-80),i+max)).slice(0,max)}
 return '';
}
function sectionFrom(text,heads,nextHeads){
 const low=text.toLowerCase();let start=-1,head='';
 for(const h of heads){const i=low.indexOf(h.toLowerCase());if(i>=0&&(start<0||i<start)){start=i;head=h}}
 if(start<0)return '';
 let end=text.length;
 for(const h of nextHeads){const i=low.indexOf(h.toLowerCase(),start+head.length);if(i>start&&i<end)end=i}
 return cleanText(text.slice(start,end)).slice(0,1800);
}
function planCompleteness(text){
 const rows=[
  ['หัวแผน/รหัสวิชา/หน่วย/เรื่อง/ชั้น', ['รหัสวิชา','หน่วยการเรียนรู้','เรื่อง','ชั้น'], 'เติมรหัสวิชา ประเภทวิชา ชื่อหน่วย เรื่อง และระดับชั้นให้ครบ'],
  ['มาตรฐานการเรียนรู้/ตัวชี้วัดหรือผลการเรียนรู้', ['มาตรฐานการเรียนรู้','ตัวชี้วัด'], 'ตรวจรหัสมาตรฐานและตัวชี้วัดให้ตรงหลักสูตร หากเป็นวิชาเพิ่มเติมใช้ผลการเรียนรู้'],
  ['สาระสำคัญ/ความคิดรวบยอด', ['สาระสำคัญ','ความคิดรวบยอด'], 'เขียนสาระสำคัญแบบความเรียงให้เชื่อมมาตรฐาน ตัวชี้วัด เรื่อง และสาระตามหลักสูตร'],
  ['จุดประสงค์การเรียนรู้', ['จุดประสงค์การเรียนรู้'], 'กำหนดจุดประสงค์ที่สังเกต/วัดได้และเชื่อมกับมาตรฐาน ตัวชี้วัด และเรื่อง'],
  ['กิจกรรมการเรียนรู้', ['กิจกรรมการเรียนรู้','ขั้นนำ','ขั้นสอน','ขั้นสรุป'], 'ระบุกระบวนการ Active Learning และบทบาทผู้เรียนให้สะท้อนจุดประสงค์'],
  ['การวัดและประเมินผล', ['การวัดและประเมินผล','วิธีการวัด','เครื่องมือ','เกณฑ์การประเมิน'], 'ให้วิธีวัด เครื่องมือ ชิ้นงาน/ภาระงาน และเกณฑ์สอดคล้องกับจุดประสงค์ทั้งความรู้ ทักษะ และคุณลักษณะ']
 ];
 return rows.map((r,i)=>{
   let ok=false;
   if(i===0)ok=hasAny(text,['รหัสวิชา'])&&hasAny(text,['หน่วยการเรียนรู้'])&&hasAny(text,['เรื่อง'])&&hasAny(text,['ชั้น']);
   else if(i===1)ok=(hasAny(text,['มาตรฐานการเรียนรู้'])&&hasAny(text,['ตัวชี้วัด']))||hasAny(text,['ผลการเรียนรู้']);
   else ok=hasAny(text,r[1]);
   return {name:r[0],ok,evidence:snippetFor(text,r[1]),fix:r[2]};
 });
}
function alignmentAnalyze(text){
 const o=sectionFrom(text,['จุดประสงค์การเรียนรู้','วัตถุประสงค์การเรียนรู้'],['สาระการเรียนรู้','กิจกรรมการเรียนรู้','กระบวนการจัดการเรียนรู้','การวัดและประเมินผล']);
 const a=sectionFrom(text,['กิจกรรมการเรียนรู้','กระบวนการจัดการเรียนรู้'],['สื่อ','แหล่งเรียนรู้','การวัดและประเมินผล','บันทึกหลังการสอน']);
 const e=sectionFrom(text,['การวัดและประเมินผล','การวัดผลและประเมินผล'],['บันทึกหลังการสอน','ความคิดเห็น','ภาคผนวก']);
 const oVerb=hasAny(o,['อธิบาย','วิเคราะห์','คำนวณ','สร้าง','ปฏิบัติ','จำแนก','เปรียบเทียบ','นำเสนอ','แก้ปัญหา','ประยุกต์','สื่อสาร']);
 const active=hasAny(a,['ลงมือ','ปฏิบัติ','กลุ่ม','อภิปราย','ทดลอง','สืบค้น','แก้ปัญหา','นำเสนอ','เกม','โครงงาน','สถานการณ์','ร่วมกัน','active learning']);
 const assess=hasAny(e,['แบบทดสอบ','ใบงาน','ชิ้นงาน','แบบประเมิน','rubric','สังเกต','ภาระงาน','คำถาม','ผลงาน','เกณฑ์']);
 const present=[o.length>30,a.length>60,e.length>30];
 const level=present.every(Boolean)&&oVerb&&active&&assess?'สอดคล้องเบื้องต้น':present.filter(Boolean).length>=2?'สอดคล้องบางส่วน':'หลักฐานไม่พอ';
 const fixes=[];
 if(!o||!oVerb)fixes.push('ปรับจุดประสงค์ให้ใช้คำกริยาที่สังเกตและวัดได้');
 if(!a||!active)fixes.push('เพิ่มกิจกรรม Active Learning ที่ผู้เรียนลงมือคิด ปฏิบัติ สร้างความรู้ และสะท้อนผล');
 if(!e||!assess)fixes.push('ระบุชิ้นงาน/ภาระงาน วิธีวัด เครื่องมือ และเกณฑ์ให้ชัด');
 if(present.every(Boolean)&&!(oVerb&&active&&assess))fixes.push('ทำ Mapping จุดประสงค์ → กิจกรรม → หลักฐานการเรียนรู้/เครื่องมือวัดให้ตรงกันรายข้อ');
 return {topic:snippetFor(text,['เรื่อง','หน่วยการเรียนรู้','ชั้น']),o,a,e,oVerb,active,assess,level,fixes};
}

function levelWords(level){
 if(level==='skilled')return {c4:['แก้ปัญหา','การแก้ปัญหา','วิธีแก้ปัญหา'],c5:['บันทึกหลังการสอน','ผลการแก้ปัญหา','ผลลัพธ์ที่ดี','ดีขึ้น']};
 if(level==='senior')return {c4:['ริเริ่ม','วิธีการใหม่','แนวทางใหม่','กิจกรรมใหม่','สื่อใหม่'],c5:['บันทึกหลังการสอน','ผลจากการใช้วิธีการใหม่','ส่งผลให้ผู้เรียน','ผลลัพธ์ที่ดี']};
 if(level==='expert')return {c4:['คิดค้น','วิธีการใหม่','พัฒนารูปแบบ','สร้างรูปแบบ'],c5:['ปรับเปลี่ยน','บันทึกหลังการสอน','ส่งผลต่อผู้เรียน','ผลลัพธ์']};
 return {c4:['นวัตกรรม','สร้างนวัตกรรม','พัฒนานวัตกรรม'],c5:['สร้างการเปลี่ยนแปลง','บันทึกหลังการสอน','ผลกระทบ','เปลี่ยนแปลงแก่ผู้เรียน']};
}
function analyzePA(text,level){
 const lw=levelWords(level);
 return indicators.map((title,i)=>{
  const base=paRuleWords[i][0];
  const crit=[
   {ok:hasAny(text,base[0]),evidence:snippetFor(text,base[0])},
   {ok:hasAny(text,base[1]),evidence:snippetFor(text,base[1])},
   {ok:hasAny(text,base[2]),evidence:snippetFor(text,base[2])},
   {ok:hasAny(text,lw.c4)&&hasAny(text,paRuleWords[i][1]),evidence:snippetFor(text,[...lw.c4,...paRuleWords[i][1]])},
   {ok:hasAny(text,lw.c5),evidence:snippetFor(text,lw.c5)}
  ];
  const baseCount=crit.slice(0,3).filter(x=>x.ok).length;
  let score=baseCount;
  if(baseCount===3)score=3+crit.slice(3).filter(x=>x.ok).length;
  const missing=crit.map((x,j)=>!x.ok?j+1:null).filter(Boolean);
  let advice='';
  if(score<3)advice='เพิ่มหลักฐานข้อพื้นฐาน '+missing.filter(x=>x<=3).join(', ')+' ให้ปรากฏชัดในแผน';
  else if(score===3)advice='ข้อ 1–3 ครบเบื้องต้น ควรเพิ่มหลักฐานข้อ 4–5 ให้สะท้อนระดับ "'+target().expected+'"';
  else if(score===4)advice='เพิ่มหลักฐานข้อ '+missing.join(', ')+' โดยเฉพาะผลที่เกิดกับผู้เรียนและบันทึกหลังการสอน เพื่อมุ่งสู่ 5 คะแนน';
  else advice='พบองค์ประกอบครบ 5 ข้อเบื้องต้น ควรตรวจให้หลักฐานในแผน วิดีโอ และบันทึกหลังการสอนสอดคล้องกัน';
  return {title,criteria:crit,score,advice};
 });
}
async function extractPdfText(file){
 if(!window.pdfjsLib)throw new Error('ไม่สามารถโหลดตัวอ่าน PDF ได้');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const data=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data}).promise;let parts=[];
 for(let p=1;p<=pdf.numPages;p++){
  const page=await pdf.getPage(p),tc=await page.getTextContent();
  parts.push('หน้า '+p+'\n'+tc.items.map(x=>x.str).join(' '));
 }
 return cleanText(parts.join('\n'));
}

 document.querySelector('#content').innerHTML='<div class="card no-print"><div class="head"><div><h2>รายงานสรุปก่อนยื่น DPA</h2><div class="muted">พิมพ์หรือบันทึกเป็น PDF</div></div><button class="btn" id="printReport">พิมพ์รายงาน</button></div></div><div class="card"><div class="print-only"><h2 style="text-align:center">รายงานตรวจความพร้อมการขอมีหรือเลื่อนวิทยฐานะ</h2></div><p><b>ผู้ขอ:</b> '+esc(state.applicant.name||'-')+' &nbsp; <b>สถานศึกษา:</b> '+esc(state.school.name)+'</p><p><b>วิทยฐานะที่ขอ:</b> '+esc(t.label)+' &nbsp; <b>ระดับที่คาดหวัง:</b> '+esc(t.expected)+'</p><h3>1. ผลตรวจคุณสมบัติ</h3>'+statusHtml(e)+'<h3>2. ผลประเมินจำลองด้านที่ 1 และ 2</h3><div class="tbl"><table><thead><tr><th>ด้าน</th><th>คะแนน</th><th>เกณฑ์รวม</th></tr></thead><tbody><tr><td>ด้านที่ 1 ทักษะการจัดการเรียนรู้และการจัดการชั้นเรียน</td><td>'+w.d1+'/80</td><td rowspan="2">'+t.pass+'%</td></tr><tr><td>ด้านที่ 2 ผลลัพธ์การเรียนรู้ของผู้เรียน</td><td>'+w.d2+'/20</td></tr><tr><td><b>รวม</b></td><td><b>'+w.total+'/100</b></td><td><b>'+(e.score?'ผ่านเกณฑ์จำลอง':'ยังไม่ผ่านเกณฑ์จำลอง')+'</b></td></tr></tbody></table></div><h3>3. ประเด็นแก้ไขก่อนยื่น</h3>'+gapHtml(e)+'<h3>4. ข้อเสนอแนะรายตัวชี้วัด</h3>'+state.planNotes.map((x,i)=>x?'<p><b>'+(i+1)+'. '+esc(indicators[i])+'</b><br>'+esc(x)+'</p>':'').join('')+'<h3>5. สถานะสรุป</h3><p><b>'+(e.ready?'พร้อมยื่นตรวจสอบเอกสารในระบบ DPA':'ควรปรับปรุง/จัดเตรียมข้อมูลให้ครบก่อนยื่น DPA')+'</b></p><p class="muted">รายงานนี้เป็นเครื่องมือเตรียมความพร้อมภายใน ไม่ใช่ผลการพิจารณาของ ก.ค.ศ.</p></div>';
 document.querySelector('#printReport').onclick=()=>window.print();
}
function settingsPage(){
 const acc=accounts();
 document.querySelector('#content').innerHTML='<div class="grid g2"><div class="card"><div class="head"><div><h2>บัญชีผู้ใช้ระบบ</h2><div class="muted">ผู้ใช้ทุกคนต้องลงชื่อเข้าใช้ก่อนใช้งาน</div></div><button class="btn" id="addUser">เพิ่มผู้ใช้</button></div><div class="tbl"><table><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>สิทธิ์</th></tr></thead><tbody>'+acc.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td></tr>').join('')+'</tbody></table></div><div id="newUser"></div></div><div class="card"><h2>Google Drive สำรองข้อมูล</h2><p>สร้างโฟลเดอร์ปลายทางไว้แล้ว:</p><p><a href="'+DRIVE_FOLDER_URL+'" target="_blank">ระบบตรวจแผนจัดการเรียนรู้และวิทยฐานะ ว9-2564</a></p><div class="note warn">GitHub Pages เป็นเว็บแบบ Static จึงไม่สามารถเขียนไฟล์เข้า Google Drive อัตโนมัติโดยปลอดภัยได้หากยังไม่มี Google OAuth Client ID/Backend ขององค์กร รุ่นนี้จึงสำรองข้อมูลอัตโนมัติในเบราว์เซอร์ และให้ส่งออก JSON แล้วอัปโหลดไปยังโฟลเดอร์ Drive ที่กำหนด</div><button class="btn alt" id="openDrive" style="margin-top:10px">เปิดโฟลเดอร์ Google Drive</button></div></div>';
 document.querySelector('#openDrive').onclick=()=>window.open(DRIVE_FOLDER_URL,'_blank');
 document.querySelector('#addUser').onclick=()=>{document.querySelector('#newUser').innerHTML='<div class="note" style="margin-top:10px"><div class="grid g2">'+f('un','ชื่อผู้ใช้','')+f('ue','อีเมล','')+f('up','รหัสผ่าน','','password')+sel('ur','สิทธิ์',[['member','member'],['admin','admin']],'member')+'</div><button class="btn" id="createUser" style="margin-top:9px">สร้างบัญชี</button></div>';document.querySelector('#createUser').onclick=async()=>{const n=val('un'),e=val('ue').trim().toLowerCase(),p=val('up');if(!n||!e||p.length<4){toast('กรอกข้อมูลให้ครบ');return}const a=accounts();if(a.some(x=>x.email===e)){toast('มีอีเมลนี้แล้ว');return}a.push({id:'u_'+Date.now(),name:n,email:e,role:val('ur'),pass:await hash(p)});setAccounts(a);toast('สร้างบัญชีแล้ว');settingsPage()}}
}
function render(){nav();setTitle();if(current==='dashboard')dashboard();else if(current==='profile')profilePage();else if(current==='eligibility')eligibilityPage();else if(current==='auto')autoPage();else if(current==='evidence')evidencePage();else if(current==='result')resultPage();else if(current==='report')reportPage();else settingsPage()}
function odb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function putFile(x){return odb().then(db=>new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(x);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)}))}
function getFile(id){return odb().then(db=>new Promise((ok,no)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
function renderFileStatus(id){const e=document.querySelector('#fs_'+id);if(e)getFile(id).then(x=>{e.textContent=x?x.name:'ยังไม่แนบในเครื่อง';e.className='badge '+(x?'ok':'')})}
function backup(){const data=JSON.stringify({state,accounts:accounts(),createdAt:new Date().toISOString()},null,2),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PA_Plan_Review_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('ดาวน์โหลดไฟล์สำรองแล้ว')}
function restore(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=normalizeState(x.state||x);if(x.accounts)setAccounts(x.accounts);save('นำเข้าข้อมูลแล้ว');render()}catch(e){toast('ไฟล์สำรองไม่ถูกต้อง')}};r.readAsText(file)}
document.querySelector('#menu').onclick=()=>document.querySelector('#side').classList.toggle('open');
document.querySelector('#logout').onclick=logout;document.querySelector('#backupBtn').onclick=backup;document.querySelector('#restoreBtn').onclick=()=>document.querySelector('#restoreFile').click();document.querySelector('#restoreFile').onchange=function(){if(this.files[0])restore(this.files[0]);this.value=''};
try{session=JSON.parse(sessionStorage.getItem(SES))}catch(e){}
if(session&&accounts().some(x=>x.id===session.id))show();else auth();
</script>
