function outcomeItem(i,title){const score=state.outcomeScores[i]||0;return '<div class="rubric-item"><div class="title">'+(i+1)+'. '+esc(title)+'</div><div class="criteria">'+outcomes[i].map((x,j)=>'<label><input type="checkbox" data-out="'+i+'" '+(state.outcomeChecks[i][j]?'checked':'')+'> '+(j+1)+') '+esc(x)+'</label>').join('')+'</div><div class="scorebox"><b>คะแนนจำลอง</b><select id="os'+i+'">'+[0,1,2,3,4,5].map(s=>'<option '+(score===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="advice '+(score>=4?'ok':'')+'">'+esc(score>=4?'ผลลัพธ์ผู้เรียนมีหลักฐานค่อนข้างชัด ควรตรวจความเชื่อมโยงกับแผนและวิดีโอ':'ควรเพิ่มชิ้นงาน/ผลการปฏิบัติของผู้เรียนให้เห็นผลลัพธ์ตามตัวบ่งชี้ และเลือกหลักฐานที่ตรวจสอบย้อนกลับได้')+'</div><div class="field"><label>ข้อเสนอแนะ</label><textarea id="on'+i+'">'+esc(state.outcomeNotes[i])+'</textarea></div></div>'}
function evidencePage(){
 const d=state.docs,req=state.applicant.requested;
 document.querySelector('#content').innerHTML='<div class="card"><div class="head"><div><h2>ชุดหลักฐานประกอบการยื่น DPA</h2><div class="muted">แนบไฟล์ไว้ในเครื่อง หรือระบุลิงก์ Google Drive ของไฟล์จริง</div></div><button class="btn" id="saveDocs">บันทึกลิงก์</button></div>'+
 evidenceBlock('plan','แผนการจัดการเรียนรู้ PDF 1 ไฟล์','planLink',d.planLink,'application/pdf')+
 evidenceBlock('problem','วิดีโอสภาพปัญหา/ที่มา/แรงบันดาลใจ MP4 1 ไฟล์','problemVideoLink',d.problemVideoLink,'video/mp4')+
 evidenceBlock('teaching','วิดีโอบันทึกการสอน MP4 1 ไฟล์','teachingVideoLink',d.teachingVideoLink,'video/mp4')+
 '<h3>ผลลัพธ์การเรียนรู้ของผู้เรียน ไม่เกิน 3 ไฟล์</h3>'+[0,1,2].map(i=>evidenceBlock('student'+i,'หลักฐานผลลัพธ์ผู้เรียน '+(i+1),'studentLink'+i,d.studentLinks[i],'video/mp4,image/*,application/pdf')).join('')+
 (req==='expert'||req==='special'?'<h3>ผลงานทางวิชาการ</h3>'+evidenceBlock('academic1',req==='expert'?'งานวิจัยหรือนวัตกรรม 1 รายการ PDF':'งานวิจัย 1 รายการ PDF','academic1',d.academic1,'application/pdf')+(req==='special'?evidenceBlock('academic2','นวัตกรรมการจัดการเรียนรู้ 1 รายการ PDF','academic2',d.academic2,'application/pdf')+'<label class="checkrow"><input id="tci" type="checkbox" '+(d.tci?'checked':'')+'> งานวิจัยเผยแพร่ในวารสาร TCI กลุ่ม 1 หรือ 2 และมีไฟล์บทความประกอบ</label>':''):'')+
 '<div class="note" style="margin-top:12px">ไฟล์ที่แนบในแอปเก็บใน IndexedDB ของเบราว์เซอร์ อาจติดข้อจำกัดพื้นที่ โดยเฉพาะวิดีโอขนาดใหญ่ แนะนำเก็บไฟล์จริงใน Google Drive แล้ววางลิงก์ไว้ในระบบ</div></div>';
 document.querySelector('#saveDocs').onclick=()=>{d.planLink=val('planLink');d.problemVideoLink=val('problemVideoLink');d.teachingVideoLink=val('teachingVideoLink');d.studentLinks=[val('studentLink0'),val('studentLink1'),val('studentLink2')];d.academic1=val('academic1');d.academic2=val('academic2');if(document.querySelector('#tci'))d.tci=document.querySelector('#tci').checked;save();evidencePage()};
 document.querySelectorAll('[data-upload]').forEach(b=>b.onchange=async()=>{const f=b.files[0];if(!f)return;await putFile({id:b.dataset.upload,scope:b.dataset.upload,name:f.name,type:f.type,size:f.size,blob:f});toast('แนบไฟล์ในเครื่องแล้ว');renderFileStatus(b.dataset.upload)});
 ['plan','problem','teaching','student0','student1','student2','academic1','academic2'].forEach(renderFileStatus);

function evidenceBlock(scope,label,id,link,accept){return '<div class="upload"><div class="row"><b>'+label+'</b><span id="fs_'+scope+'" class="badge">ยังไม่แนบในเครื่อง</span></div><div class="grid g2" style="margin-top:8px"><div class="field"><label>แนบไฟล์ในเครื่อง</label><input data-upload="'+scope+'" type="file" accept="'+accept+'"></div><div class="field"><label>ลิงก์ Google Drive / URL หลักฐาน</label><input id="'+id+'" value="'+esc(link)+'" placeholder="https://drive.google.com/..."></div></div></div>'}
function videoPage(){
 const v=state.video,checks=[['singleCamera','ใช้กล้องตัวเดียว (Single video camera)'],['noTitle','ไม่มีส่วนนำ (No Title)'],['noMusic','ไม่มีดนตรีประกอบ/สอดแทรก'],['oneTake','ถ่ายต่อเนื่อง One-Take'],['noEdit','ไม่มีการตัดต่อ'],['fixedAngle','ไม่เดินกล้อง/ไม่ย้ายมุมกล้อง'],['overview','เห็นภาพรวมชั้นเรียน/ผู้เรียนชัดเจน'],['clearAudio','ภาพและเสียงชัดเจนเพียงพอสำหรับประเมิน']];
 document.querySelector('#content').innerHTML='<div class="grid g2"><div class="card"><div class="head"><div><h2>ตรวจวิดีโอบันทึกการสอน</h2><div class="muted">ตามรูปแบบที่ ก.ค.ศ. กำหนด</div></div><button class="btn" id="saveVideo">บันทึก</button></div>'+checks.map(x=>'<label class="checkrow"><input id="v_'+x[0]+'" type="checkbox" '+(v[x[0]]?'checked':'')+'> '+x[1]+'</label>').join('')+'<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><label class="checkrow"><input id="v_teachingMp4" type="checkbox" '+(v.teachingMp4?'checked':'')+'> ไฟล์บันทึกการสอนเป็น MP4</label>'+f('v_teachingMinutes','ความยาววิดีโอบันทึกการสอน (นาที)',v.teachingMinutes,'number')+'<div class="note">ตามคู่มือ: ความยาวตามคาบจริง แต่รวมแล้วไม่เกิน 60 นาที</div></div><div class="card"><h2>วิดีโอสภาพปัญหา/แรงบันดาลใจ</h2><label class="checkrow"><input id="v_problemMp4" type="checkbox" '+(v.problemMp4?'checked':'')+'> ไฟล์เป็น MP4</label><label class="checkrow"><input id="v_teacherPresents" type="checkbox" '+(v.teacherPresents?'checked':'')+'> ผู้ขอปรากฏตัวและบรรยายด้วยตนเอง</label>'+f('v_problemMinutes','ความยาววิดีโอ (นาที)',v.problemMinutes,'number')+'<div class="note">ตามคู่มือ: ไม่เกิน 10 นาที ไม่มี Title ไม่มีดนตรี/เสียงพิเศษ และไม่มีการซ้อนตัวอักษรระหว่างนำเสนอ</div></div></div>';
 document.querySelector('#saveVideo').onclick=()=>{checks.forEach(x=>v[x[0]]=document.querySelector('#v_'+x[0]).checked);v.teachingMp4=document.querySelector('#v_teachingMp4').checked;v.teachingMinutes=val('v_teachingMinutes');v.problemMp4=document.querySelector('#v_problemMp4').checked;v.problemMinutes=val('v_problemMinutes');v.teacherPresents=document.querySelector('#v_teacherPresents').checked;save();videoPage()}
}

 const e=eligibility(),w=e.w,t=target(),pct=Math.round([e.dur,e.paok,e.discipline,e.license,e.workload,e.docs,e.videoOk,e.score].filter(Boolean).length/8*100);

}
function reportPage(){
 const e=eligibility(),w=e.w,t=target();
 document.querySelector('#content').innerHTML='<div class="card no-print"><div class="head"><div><h2>รายงานสรุปก่อนยื่น DPA</h2><div class="muted">พิมพ์หรือบันทึกเป็น PDF</div></div><button class="btn" id="printReport">พิมพ์รายงาน</button></div></div><div class="card"><div class="print-only"><h2 style="text-align:center">รายงานตรวจความพร้อมการขอมีหรือเลื่อนวิทยฐานะ</h2></div><p><b>ผู้ขอ:</b> '+esc(state.applicant.name||'-')+' &nbsp; <b>สถานศึกษา:</b> '+esc(state.school.name)+'</p><p><b>วิทยฐานะที่ขอ:</b> '+esc(t.label)+' &nbsp; <b>ระดับที่คาดหวัง:</b> '+esc(t.expected)+'</p><h3>1. ผลตรวจคุณสมบัติ</h3>'+statusHtml(e)+'<h3>2. ผลประเมินจำลองด้านที่ 1 และ 2</h3><div class="tbl"><table><thead><tr><th>ด้าน</th><th>คะแนน</th><th>เกณฑ์รวม</th></tr></thead><tbody><tr><td>ด้านที่ 1 ทักษะการจัดการเรียนรู้และการจัดการชั้นเรียน</td><td>'+w.d1+'/80</td><td rowspan="2">'+t.pass+'%</td></tr><tr><td>ด้านที่ 2 ผลลัพธ์การเรียนรู้ของผู้เรียน</td><td>'+w.d2+'/20</td></tr><tr><td><b>รวม</b></td><td><b>'+w.total+'/100</b></td><td><b>'+(e.score?'ผ่านเกณฑ์จำลอง':'ยังไม่ผ่านเกณฑ์จำลอง')+'</b></td></tr></tbody></table></div><h3>3. ประเด็นแก้ไขก่อนยื่น</h3>'+gapHtml(e)+'<h3>4. ข้อเสนอแนะรายตัวชี้วัด</h3>'+state.planNotes.map((x,i)=>x?'<p><b>'+(i+1)+'. '+esc(indicators[i])+'</b><br>'+esc(x)+'</p>':'').join('')+'<h3>5. สถานะสรุป</h3><p><b>'+(e.ready?'พร้อมยื่นตรวจสอบเอกสารในระบบ DPA':'ควรปรับปรุง/จัดเตรียมข้อมูลให้ครบก่อนยื่น DPA')+'</b></p><p class="muted">รายงานนี้เป็นเครื่องมือเตรียมความพร้อมภายใน ไม่ใช่ผลการพิจารณาของ ก.ค.ศ.</p></div>';
 document.querySelector('#printReport').onclick=()=>window.print();
}
function settingsPage(){
 const acc=accounts();
 document.querySelector('#content').innerHTML='<div class="grid g2"><div class="card"><div class="head"><div><h2>บัญชีผู้ใช้ระบบ</h2><div class="muted">ผู้ใช้ทุกคนต้องลงชื่อเข้าใช้ก่อนใช้งาน</div></div><button class="btn" id="addUser">เพิ่มผู้ใช้</button></div><div class="tbl"><table><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>สิทธิ์</th></tr></thead><tbody>'+acc.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td></tr>').join('')+'</tbody></table></div><div id="newUser"></div></div><div class="card"><h2>Google Drive สำรองข้อมูล</h2><p>สร้างโฟลเดอร์ปลายทางไว้แล้ว:</p><p><a href="'+DRIVE_FOLDER_URL+'" target="_blank">ระบบตรวจแผนจัดการเรียนรู้และวิทยฐานะ ว9-2564</a></p><div class="note warn">GitHub Pages เป็นเว็บแบบ Static จึงไม่สามารถเขียนไฟล์เข้า Google Drive อัตโนมัติโดยปลอดภัยได้หากยังไม่มี Google OAuth Client ID/Backend ขององค์กร รุ่นนี้จึงสำรองข้อมูลอัตโนมัติในเบราว์เซอร์ และให้ส่งออก JSON แล้วอัปโหลดไปยังโฟลเดอร์ Drive ที่กำหนด</div><button class="btn alt" id="openDrive" style="margin-top:10px">เปิดโฟลเดอร์ Google Drive</button></div></div>';
 document.querySelector('#openDrive').onclick=()=>window.open(DRIVE_FOLDER_URL,'_blank');
 document.querySelector('#addUser').onclick=()=>{document.querySelector('#newUser').innerHTML='<div class="note" style="margin-top:10px"><div class="grid g2">'+f('un','ชื่อผู้ใช้','')+f('ue','อีเมล','')+f('up','รหัสผ่าน','','password')+sel('ur','สิทธิ์',[['member','member'],['admin','admin']],'member')+'</div><button class="btn" id="createUser" style="margin-top:9px">สร้างบัญชี</button></div>';document.querySelector('#createUser').onclick=async()=>{const n=val('un'),e=val('ue').trim().toLowerCase(),p=val('up');if(!n||!e||p.length<4){toast('กรอกข้อมูลให้ครบ');return}const a=accounts();if(a.some(x=>x.email===e)){toast('มีอีเมลนี้แล้ว');return}a.push({id:'u_'+Date.now(),name:n,email:e,role:val('ur'),pass:await hash(p)});setAccounts(a);toast('สร้างบัญชีแล้ว');settingsPage()}}
}
function render(){nav();setTitle();if(current==='dashboard')dashboard();else if(current==='profile')profilePage();else if(current==='eligibility')eligibilityPage();else if(current==='plan')planPage();else if(current==='outcome')outcomePage();else if(current==='evidence')evidencePage();else if(current==='video')videoPage();else if(current==='result')resultPage();else if(current==='report')reportPage();else settingsPage()}
function odb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function putFile(x){return odb().then(db=>new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(x);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)}))}
function getFile(id){return odb().then(db=>new Promise((ok,no)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
function renderFileStatus(id){const e=document.querySelector('#fs_'+id);if(e)getFile(id).then(x=>{e.textContent=x?x.name:'ยังไม่แนบในเครื่อง';e.className='badge '+(x?'ok':'')})}
function backup(){const data=JSON.stringify({state,accounts:accounts(),createdAt:new Date().toISOString()},null,2),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PA_Plan_Review_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('ดาวน์โหลดไฟล์สำรองแล้ว')}
function restore(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=x.state||x;if(x.accounts)setAccounts(x.accounts);save('นำเข้าข้อมูลแล้ว');render()}catch(e){toast('ไฟล์สำรองไม่ถูกต้อง')}};r.readAsText(file)}
document.querySelector('#menu').onclick=()=>document.querySelector('#side').classList.toggle('open');
document.querySelector('#logout').onclick=logout;document.querySelector('#backupBtn').onclick=backup;document.querySelector('#restoreBtn').onclick=()=>document.querySelector('#restoreFile').click();document.querySelector('#restoreFile').onchange=function(){if(this.files[0])restore(this.files[0]);this.value=''};
try{session=JSON.parse(sessionStorage.getItem(SES))}catch(e){}
if(session&&accounts().some(x=>x.id===session.id))show();else auth();
</script>
