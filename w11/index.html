function odb(){return new Promise(function(ok,no){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){var st=r.result.createObjectStore(STORE,{keyPath:'id'});st.createIndex('scope','scope',{unique:false})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
function put(f){return odb().then(function(db){return new Promise(function(ok,no){var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(f);tx.oncomplete=ok;tx.onerror=function(){no(tx.error)}})})}
function list(k){return odb().then(function(db){return new Promise(function(ok,no){var r=db.transaction(STORE,'readonly').objectStore(STORE).index('scope').getAll(k);r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})})}
function allFiles(){return odb().then(function(db){return new Promise(function(ok,no){var r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})})}
function delFile(id){return odb().then(function(db){return new Promise(function(ok,no){var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=ok;tx.onerror=function(){no(tx.error)}})})}
function clearFiles(){return odb().then(function(db){return new Promise(function(ok,no){var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=ok;tx.onerror=function(){no(tx.error)}})})}
function openAtt(k){att=k;showFiles();E('#fd').showModal()}
function showFiles(){list(att).then(function(fs){E('#fl').innerHTML=fs.length?fs.map(function(f){return'<div class="file"><div><b>'+esc(f.name)+'</b><span class="muted">'+Math.round(f.size/1024)+' KB</span></div><button class="btn alt sm" data-open="'+f.id+'">เปิด</button><button class="btn red sm" data-del="'+f.id+'">ลบ</button></div>'}).join(''):'<div class="muted">ยังไม่มีไฟล์แนบ</div>';A('[data-open]').forEach(function(b){b.onclick=function(){preview(b.dataset.open)}});A('[data-del]').forEach(function(b){b.onclick=function(){delFile(b.dataset.del).then(function(){showFiles();countAttach();toast('ลบไฟล์แล้ว')})}})})}
function countAttach(){var x=E('#ac');if(!x)return;list(scopeKey(mod)).then(function(fs){x.textContent=fs.length+' ไฟล์'})}
function preview(id){allFiles().then(function(fs){var f=fs.find(function(x){return x.id===id});if(!f)return;var u=URL.createObjectURL(f.blob);E('#pvt').textContent=f.name;E('#pvb').innerHTML=f.type==='application/pdf'?'<iframe src="'+u+'" style="width:100%;height:72vh;border:0;background:white"></iframe>':'<img src="'+u+'" style="max-width:100%;max-height:72vh">';E('#pv').dataset.u=u;E('#pv').showModal()})}
function b64(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=function(){no(r.error)};r.readAsDataURL(blob)})}
function unb64(x){var a=x.split(','),mime=(a[0].match(/data:(.*?);/)||[])[1]||'application/octet-stream',bin=atob(a[1]),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function backup(){allFiles().then(async function(fs){var z=[];for(var i=0;i<fs.length;i++){var f=Object.assign({},fs[i]);f.blob=await b64(fs[i].blob);z.push(f)}var data={state:s,files:z,at:new Date().toISOString()},bl=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='W11_2569_Charukkhawe_backup.json';a.click();toast('ดาวน์โหลดไฟล์สำรองแล้ว')})}
function restore(file){file.text().then(async function(t){var z=JSON.parse(t);s=z.state;await clearFiles();for(var i=0;i<(z.files||[]).length;i++){var f=z.files[i];f.blob=unb64(f.blob);await put(f)}save('นำเข้าข้อมูลสำเร็จ');render()}).catch(function(){toast('นำเข้าข้อมูลไม่สำเร็จ')})}
document.addEventListener('click',function(e){var b=e.target.closest('[data-att]');if(b)openAtt(b.dataset.att)});
E('#fi').onchange=async function(){for(var i=0;i<this.files.length;i++){var f=this.files[i];if(['image/jpeg','image/png','image/webp','application/pdf'].indexOf(f.type)<0)continue;await put({id:'f_'+Date.now()+'_'+i,scope:att,name:f.name,type:f.type,size:f.size,blob:f})}this.value='';showFiles();countAttach();toast('แนบไฟล์แล้ว')};
E('#fdx').onclick=function(){E('#fd').close()};E('#pvx').onclick=function(){var d=E('#pv');if(d.dataset.u)URL.revokeObjectURL(d.dataset.u);E('#pvb').innerHTML='';d.close()};E('#menu').onclick=function(){E('#side').classList.toggle('open')};E('#print').onclick=function(){print()};E('#backup').onclick=backup;E('#restore').onclick=function(){E('#restoreFile').click()};E('#restoreFile').onchange=function(){if(this.files[0])restore(this.files[0]);this.value=''};
render();
</script>
